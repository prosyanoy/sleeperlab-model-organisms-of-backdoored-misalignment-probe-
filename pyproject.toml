[project]
name = "sleeperlab"
version = "0.1.0"
description = "Model organisms of backdoored misalignment + linear probe detection"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
